name: 构建 Linux 可执行文件

on:
  push:
    branches: [linux-port]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write  # 用于创建 Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 构建 — 单批次清洗 (app)
        run: |
          pyinstaller \
            --onefile \
            --name tenpaytrade \
            --paths scripts \
            --add-data "scripts/config:scripts/config" \
            --add-data "scripts/utils:scripts/utils" \
            --hidden-import=chinesecalendar \
            --hidden-import=utils.paths \
            scripts/app.py

      - name: PyInstaller 构建 — 多批次合并 (app_merge)
        run: |
          pyinstaller \
            --onefile \
            --name tenpaytrade-merge \
            --paths scripts \
            --add-data "scripts/utils:scripts/utils" \
            --hidden-import=utils.paths \
            scripts/app_merge.py

      - name: 验证构建产物
        run: |
          echo "=== 构建产物 ==="
          ls -lh dist/
          echo ""
          echo "=== 测试 tenpaytrade --help ==="
          ./dist/tenpaytrade --help
          echo ""
          echo "=== 测试 tenpaytrade-merge --help ==="
          ./dist/tenpaytrade-merge --help

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tenpaytrade-linux
          path: |
            dist/tenpaytrade
            dist/tenpaytrade-merge
          retention-days: 30

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tenpaytrade
            dist/tenpaytrade-merge
          generate_release_notes: true
